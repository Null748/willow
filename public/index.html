<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Willow</title>
<meta name="description" content="Search the web and open any page through Willow.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --mist: #e9efea;
    --strip: #d7e0da;
    --ink: #17261f;
    --ink-soft: #566860;
    --leaf: #4f7d53;
    --line: rgba(23, 38, 31, .18);
    --sans: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --mist: #0f1a16;
      --strip: #070e0b;
      --ink: #e4eee7;
      --ink-soft: #9db0a5;
      --leaf: #8dbb8a;
      --line: rgba(228, 238, 231, .18);
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; background: var(--mist); color: var(--ink); font: 400 14px/1.4 var(--sans); -webkit-font-smoothing: antialiased; }
  :focus-visible { outline: 2px solid var(--leaf); outline-offset: -2px; }

  #strip { display: flex; align-items: flex-end; gap: 4px; padding: 8px 8px 0; background: var(--strip); user-select: none; -webkit-user-select: none; }
  #tabs { display: flex; align-items: flex-end; gap: 2px; min-width: 0; flex: 0 1 auto; }
  .tab {
    position: relative; display: flex; align-items: center; gap: 8px; height: 36px;
    padding: 0 6px 0 12px; flex: 0 1 220px; min-width: 40px;
    border-radius: 10px 10px 0 0; color: var(--ink-soft); cursor: default;
  }
  .tab:hover { background: color-mix(in srgb, var(--ink) 8%, transparent); }
  .tab[aria-selected="true"] { background: var(--mist); color: var(--ink); }
  .tab::after { content: ""; position: absolute; right: -2px; top: 10px; bottom: 10px; width: 1px; background: var(--line); }
  .tab[aria-selected="true"]::after,
  .tab:hover::after,
  .tab:has(+ .tab[aria-selected="true"])::after,
  .tab:has(+ .tab:hover)::after,
  .tab:last-child::after { display: none; }
  .tab.dragging { opacity: .45; }
  .fav { flex: none; width: 16px; height: 16px; border-radius: 3px; }
  .title { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .x { flex: none; display: grid; place-items: center; width: 22px; height: 22px; border: 0; border-radius: 50%; background: transparent; color: inherit; cursor: pointer; padding: 0; }
  .x:hover { background: color-mix(in srgb, var(--ink) 16%, transparent); }
  .x svg, #new svg { width: 12px; height: 12px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; }
  #new { flex: none; display: grid; place-items: center; width: 30px; height: 30px; margin-bottom: 3px; border: 0; border-radius: 50%; background: transparent; color: var(--ink-soft); cursor: pointer; padding: 0; }
  #new svg { width: 14px; height: 14px; }
  #new:hover:not(:disabled) { background: color-mix(in srgb, var(--ink) 12%, transparent); color: var(--ink); }
  #new:disabled { opacity: .35; cursor: default; }

  #stage { position: relative; flex: 1; min-height: 0; }
  .pane { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: none; background: var(--mist); }
  .pane.on { display: block; }
</style>
</head>
<body>
<div id="strip">
  <div id="tabs" role="tablist" aria-label="Tabs"></div>
  <button id="new" type="button" aria-label="New tab" title="New tab"><svg viewBox="0 0 24 24"><path d="M12 4v16M4 12h16"/></svg></button>
</div>
<div id="stage"></div>

<script>
(() => {
  const BLANK = '/app.html';
  const MAX = 15;
  const KEY = 'willow:tabs';
  const tabsEl = document.getElementById('tabs');
  const stage = document.getElementById('stage');
  const newBtn = document.getElementById('new');
  const CLOSE_ICON = '<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>';

  let tabs = [];
  let active = null;
  let seq = 0;
  let dragging = null;
  let lastSaved = '';

  const proxied = (u) => '/api/proxy?url=' + encodeURIComponent(u);

  function create(src = BLANK, select = true) {
    if (tabs.length >= MAX) return null;
    const id = ++seq;

    const frame = document.createElement('iframe');
    frame.className = 'pane';
    frame.title = 'Tab ' + id;
    frame.allow = 'fullscreen';
    frame.src = src;

    const el = document.createElement('div');
    el.className = 'tab';
    el.setAttribute('role', 'tab');
    el.setAttribute('aria-selected', 'false');
    el.draggable = true;
    el.tabIndex = -1;
    el.innerHTML = '<img class="fav" alt="" src="/favicon.svg"><span class="title">New tab</span><button class="x" type="button" aria-label="Close tab" tabindex="-1">' + CLOSE_ICON + '</button>';

    const tab = { id, el, frame, src, label: 'New tab', host: '' };
    tabs.push(tab);
    tabsEl.appendChild(el);
    stage.appendChild(frame);

    el.addEventListener('click', () => choose(tab));
    el.querySelector('.x').addEventListener('click', (e) => { e.stopPropagation(); close(tab); });
    el.addEventListener('auxclick', (e) => { if (e.button === 1) { e.preventDefault(); close(tab); } });
    el.addEventListener('mousedown', (e) => { if (e.button === 1) e.preventDefault(); });
    el.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); choose(tab); }
      else if (e.key === 'Delete') close(tab);
      else if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
        const i = tabs.indexOf(tab) + (e.key === 'ArrowRight' ? 1 : -1);
        const next = tabs[(i + tabs.length) % tabs.length];
        choose(next); next.el.focus();
      }
    });
    el.addEventListener('dragstart', (e) => {
      dragging = tab;
      el.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', String(id));
    });
    el.addEventListener('dragend', () => {
      el.classList.remove('dragging');
      dragging = null;
      const order = [...tabsEl.children];
      tabs.sort((a, b) => order.indexOf(a.el) - order.indexOf(b.el));
      save();
    });

    if (select) choose(tab);
    newBtn.disabled = tabs.length >= MAX;
    return tab;
  }

  function choose(tab) {
    active = tab;
    for (const t of tabs) {
      const on = t === tab;
      t.el.setAttribute('aria-selected', String(on));
      t.el.tabIndex = on ? 0 : -1;
      t.frame.classList.toggle('on', on);
    }
    document.title = tab.label === 'New tab' ? 'Willow' : tab.label + ' — Willow';
    try {
      tab.frame.contentWindow.focus();
      const d = tab.frame.contentDocument;
      const home = d.getElementById('home');
      if (home && !home.hidden) d.getElementById('home-q').focus();
    } catch {}
    save();
  }

  function close(tab) {
    const i = tabs.indexOf(tab);
    if (i < 0) return;
    tabs.splice(i, 1);
    tab.el.remove();
    tab.frame.remove();
    newBtn.disabled = tabs.length >= MAX;
    if (!tabs.length) return create();
    if (tab === active) choose(tabs[i] || tabs[i - 1]);
    else save();
  }

  tabsEl.addEventListener('dragover', (e) => {
    if (!dragging) return;
    e.preventDefault();
    const over = e.target.closest && e.target.closest('.tab');
    if (!over || over === dragging.el) return;
    const r = over.getBoundingClientRect();
    const after = e.clientX > r.left + r.width / 2;
    tabsEl.insertBefore(dragging.el, after ? over.nextSibling : over);
  });

  /* Read each tab's page title and address so the tab strip stays in sync. */
  function sync() {
    for (const t of tabs) {
      let title = '', search = '', path = '';
      try {
        const w = t.frame.contentWindow;
        title = w.document.title || '';
        search = w.location.search;
        path = w.location.pathname;
      } catch { continue; }

      const u = new URLSearchParams(search).get('u');
      let host = '';
      if (u) { try { host = new URL(u).hostname; } catch {} }

      let label = title.replace(/\s+[—-]\s+Willow$/, '').trim();
      if (!label || label === 'Willow') label = host || 'New tab';

      if (label !== t.label) {
        t.label = label;
        t.el.querySelector('.title').textContent = label;
        t.el.title = label;
        if (t === active) document.title = label === 'New tab' ? 'Willow' : label + ' — Willow';
      }
      if (host !== t.host) {
        t.host = host;
        const img = t.el.querySelector('.fav');
        img.onerror = () => { img.onerror = null; img.src = '/favicon.svg'; };
        img.src = host ? proxied('https://www.google.com/s2/favicons?domain=' + host + '&sz=32') : '/favicon.svg';
      }
      if (path.startsWith(BLANK)) t.src = path + search;
    }
    save();
  }

  function save() {
    try {
      const data = JSON.stringify({ tabs: tabs.map((t) => t.src), active: tabs.indexOf(active) });
      if (data !== lastSaved) { sessionStorage.setItem(KEY, data); lastSaved = data; }
    } catch {}
  }

  function restore() {
    // A link like /?q=cats opens as the first tab.
    if (location.search) {
      const first = create(BLANK + location.search);
      history.replaceState(null, '', location.pathname);
      return first;
    }
    try {
      const saved = JSON.parse(sessionStorage.getItem(KEY) || 'null');
      if (saved && Array.isArray(saved.tabs) && saved.tabs.length) {
        const made = saved.tabs
          .slice(0, MAX)
          .map((s) => create(typeof s === 'string' && s.startsWith(BLANK) ? s : BLANK, false));
        choose(made[Math.min(Math.max(saved.active, 0), made.length - 1)]);
        return;
      }
    } catch {}
    create();
  }

  newBtn.addEventListener('click', () => create());
  setInterval(sync, 500);
  restore();
})();
</script>
</body>
</html>
